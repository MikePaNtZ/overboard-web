name: Deploy collector

# The analytics collector: a Worker on e.overboardproject.com writing to D1.
#
# Deployed from CI rather than a laptop on purpose. The credential then lives in
# exactly one place, is rotatable in one click, and every use is logged — and
# the deploy is repeatable rather than something someone did once by hand. That
# last point is not theoretical: most of what went wrong on this project in the
# week before this shipped was something that had been done once, by hand, and
# had silently stopped working.
#
# Manual trigger only for now. It becomes push-triggered once it has deployed
# cleanly a few times — a collector that redeploys on every unrelated web commit
# is a way to lose data to an unnoticed bad deploy.

on:
  workflow_dispatch:
    inputs:
      create_db:
        description: "Create the D1 database first (only needed once)"
        type: boolean
        default: false
      purge_test_data:
        description: "Delete synthetic and self-test rows (does NOT touch real data)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: collector-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ !inputs.purge_test_data }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install wrangler
        run: npm install --no-save wrangler@4

      - name: Create the D1 database
        if: ${{ inputs.create_db }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          # Idempotent: if it already exists, say so and carry on rather than
          # failing a re-run.
          npx wrangler d1 create overboard-analytics 2>&1 | tee create.log || {
            grep -qi "already exists" create.log || exit 1
            echo "database already exists — continuing"
          }

      - name: Resolve the database id
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          # The id is looked up at deploy time rather than committed. A stale id
          # in a config file points a live collector at the wrong database and
          # nothing about it looks wrong.
          ID="$(npx wrangler d1 list --json | node -e '
            let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
              const db=JSON.parse(s).find(d=>d.name==="overboard-analytics");
              if(!db){console.error("overboard-analytics not found — run with create_db");process.exit(1)}
              process.stdout.write(db.uuid||db.id)})')"
          test -n "$ID"
          sed -i "s|PLACEHOLDER_SET_BY_DEPLOY|$ID|" wrangler.toml
          echo "resolved database id (last 4): ...${ID: -4}"

      # Before the Worker, so /health can never query a table that does not yet
      # exist. The deploy's own verification caught precisely that on the first
      # real run: schema created lazily by the POST handler meant /health 500d
      # until somebody posted an event.
      - name: Apply the schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 execute overboard-analytics --remote --file schema.sql

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

      # Pushed from CI rather than typed into the Cloudflare dashboard once, so
      # it survives the Worker being recreated and so there is exactly one place
      # the value lives. Every other credential on this project works this way
      # now; the ones that did not are the ones that broke.
      #
      # Skipped, loudly, if the secret is absent -- the dashboard then serves
      # 500 rather than falling open, which is the correct failure.
      - name: Set the dashboard token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DASHBOARD_TOKEN}" ]; then
            echo "::warning::DASHBOARD_TOKEN is not set — /dashboard will return 500 until it is."
            exit 0
          fi
          printf '%s' "$DASHBOARD_TOKEN" | npx wrangler secret put DASHBOARD_TOKEN
          echo "dashboard token set (length ${#DASHBOARD_TOKEN})"

      # Green is not proof. Four things on this project were green and broken in
      # the week before this shipped, so the deploy verifies its own result from
      # outside rather than trusting the exit code.
      - name: Verify from outside
        run: |
          set -euo pipefail
          echo "waiting for route to propagate"
          for i in $(seq 1 12); do
            CODE="$(curl -s -o /tmp/h -w '%{http_code}' --max-time 15 \
                     https://e.overboardproject.com/health || true)"
            [ "$CODE" = "200" ] && break
            sleep 10
          done
          echo "health: $CODE"; cat /tmp/h || true
          [ "$CODE" = "200" ] || { echo "collector did not answer /health"; exit 1; }

          echo "--- a real event round trip ---"
          BEFORE="$(node -e 'const f=require("fs");process.stdout.write(String(JSON.parse(f.readFileSync("/tmp/h","utf8")).events))')"
          curl -s -X POST https://e.overboardproject.com/e \
            -H 'Content-Type: text/plain' \
            --data '{"events":[{"v":1,"site":"synthetic-deploycheck","event":"page_view","sid":"deploy-verify","props":{}}]}' \
            -o /dev/null -w 'post: %{http_code}\n'
          sleep 2
          curl -s --max-time 15 https://e.overboardproject.com/health -o /tmp/h2
          AFTER="$(node -e 'const f=require("fs");process.stdout.write(String(JSON.parse(f.readFileSync("/tmp/h2","utf8")).events))')"
          echo "events before=$BEFORE after=$AFTER"
          [ "$AFTER" -gt "$BEFORE" ] || { echo "event did not land in D1"; exit 1; }

          echo "--- the required-site rule must actually reject ---"
          CODE="$(curl -s -X POST https://e.overboardproject.com/e \
                   -H 'Content-Type: text/plain' \
                   --data '{"events":[{"v":1,"event":"page_view","sid":"x","props":{}}]}' \
                   -o /dev/null -w '%{http_code}')"
          echo "missing-site returned: $CODE"
          [ "$CODE" = "400" ] || { echo "collector ACCEPTED an event with no site — the one irreversible mistake"; exit 1; }

          echo "OK — deployed, storing, and rejecting correctly."

  # ── one-off maintenance, run by hand ───────────────────────────────────────
  # Purging test data is deliberately a separate, manually triggered job rather
  # than something the deploy does: a deploy that can delete rows is one bad
  # merge away from deleting the wrong ones.
  purge-test-data:
    if: ${{ inputs.purge_test_data }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save wrangler@4
      - name: Purge, with evidence both ways
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          echo "--- before ---"
          npx wrangler d1 execute overboard-analytics --remote \
            --command "SELECT site, COUNT(*) AS n FROM events GROUP BY site ORDER BY site"
          # synthetic-* is the ratified separation axis. overboard-selftest and
          # overboard-deploycheck are named here EXPLICITLY rather than matched
          # by a pattern -- a LIKE 'overboard%' would have deleted the real site.
          npx wrangler d1 execute overboard-analytics --remote \
            --command "DELETE FROM events WHERE site LIKE 'synthetic-%' OR site IN ('overboard-selftest','overboard-deploycheck')"
          echo "--- after ---"
          npx wrangler d1 execute overboard-analytics --remote \
            --command "SELECT site, COUNT(*) AS n FROM events GROUP BY site ORDER BY site"
          echo "--- proof: zero synthetic rows remain ---"
          npx wrangler d1 execute overboard-analytics --remote \
            --command "SELECT COUNT(*) AS synthetic_remaining FROM events WHERE site LIKE 'synthetic-%'"
